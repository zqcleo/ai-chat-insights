<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>AI 使用复盘 · 设置</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    background: #f8fafc; color: #334155; padding: 32px;
  }
  .wrap { max-width: 540px; margin: 0 auto; }
  h1 { font-size: 22px; color: #0f172a; margin-bottom: 6px; }
  .subtitle { color: #64748b; font-size: 13px; margin-bottom: 24px; }
  .card {
    background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
    padding: 20px; margin-bottom: 16px;
  }
  label {
    display: block; font-size: 12px; font-weight: 600;
    color: #475569; text-transform: uppercase; letter-spacing: 0.4px;
    margin-bottom: 6px;
  }
  input {
    width: 100%; padding: 10px 12px; font-size: 14px;
    border: 1px solid #cbd5e1; border-radius: 6px;
    font-family: inherit; color: #0f172a; background: #fff;
  }
  input:focus { outline: 2px solid #2563eb; border-color: #2563eb; }
  .row + .row { margin-top: 14px; }
  .hint { font-size: 12px; color: #64748b; margin-top: 4px; }
  .hint code { background: #f1f5f9; padding: 1px 5px; border-radius: 3px; font-size: 12px; }
  button {
    margin-top: 16px; padding: 10px 18px;
    background: #2563eb; color: #fff;
    border: 0; border-radius: 6px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  .status { margin-left: 12px; font-size: 13px; }
  .status.ok { color: #16a34a; }
  .status.warn { color: #d97706; }
  .status.fail { color: #dc2626; }
  details { margin-top: 20px; }
  summary { cursor: pointer; color: #2563eb; font-size: 13px; }
  pre {
    margin-top: 8px; padding: 10px 12px;
    background: #f1f5f9; border-radius: 6px; font-size: 12px;
    font-family: "SF Mono", Menlo, monospace; overflow-x: auto;
  }
  .danger-btn { background: #94a3b8; }
  .danger-btn:hover { background: #64748b; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 600; margin-left: 6px;
    background: #e0f2fe; color: #0369a1;
  }
  .badge.off { background: #f1f5f9; color: #64748b; }
</style>
</head>
<body>
<div class="wrap">
  <h1>设置</h1>
  <div class="card">
    <h2 style="font-size:15px;color:#0f172a;margin-bottom:14px">LLM 配置 <span class="badge" id="llm-state">未启用</span></h2>
    <div class="row">
      <label>Base URL</label>
      <input id="base_url" placeholder="https://api.deepseek.com/v1" autocomplete="off">
      <div class="hint">
        包含 <code>anthropic.com</code> 走 Claude 协议，否则走 OpenAI 兼容协议（DeepSeek / OpenAI / 智谱 / 任意）
      </div>
    </div>
    <div class="row">
      <label>API Key</label>
      <input id="api_key" type="password" placeholder="sk-..." autocomplete="off">
    </div>
    <div class="row">
      <label>Model</label>
      <input id="model" placeholder="deepseek-chat / claude-haiku-4-5 / gpt-4o-mini" autocomplete="off">
    </div>
    <button id="save">保存</button>
    <button id="clear-llm" class="danger-btn" style="margin-left:8px">关闭 LLM</button>
    <span id="status" class="status"></span>
  </div>

  <div class="card" style="margin-top:20px">
    <h2 style="font-size:15px;color:#0f172a;margin-bottom:10px">本地数据</h2>
    <p class="hint" style="margin-bottom:10px">最近一次抓取的 raw / stats / 报告都存在 chrome.storage.local 里。</p>
    <button id="clear-data" class="danger-btn">清空抓取数据 + 报告</button>
    <button id="clear-all" class="danger-btn" style="margin-left:8px">清空全部（含 LLM 配置）</button>
    <span id="clear-status" class="status"></span>
  </div>
</div>
<script src="options.js"></script>
</body>
</html>
